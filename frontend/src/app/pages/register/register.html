<button
  class="register-close"
  type="button"
  (click)="registerClose.emit()"
>
  ×
</button> 

<h2>Register to KiwiApp</h2>

<p class="register-subtitle">
  Register to continue your journey
</p>

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div>
    <label class="register-label" for="name">Name:</label>
    <input type="text" id="name" formControlName="name">
  </div>
  <div>
    <label class="register-label" for="lastName">Last Name:</label>
    <input type="text" id="lastName" formControlName="lastName">
  </div>
  <div>
    <label class="register-label" for="email">Email:</label>
    <input type="email" id="email" formControlName="email">
  </div>
  <div>
    <label class="register-label" for="password">Password:</label>
    <input type="password" id="password" formControlName="password">
  </div>
  <div>
    <label class="register-label" for="passport">Passport:</label>
    <input type="text" id="passport" formControlName="passport">
  </div>
  <button type="submit" class="register-submit">Register</button>
</form>
